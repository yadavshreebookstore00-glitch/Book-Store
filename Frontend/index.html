<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Yadav Shree Book Store | Buy Books Online</title>

    <meta
      name="description"
      content="Yadav Shree Book Store is an online bookstore where you can discover and buy books across different categories at affordable prices."
    />

    <meta
      name="keywords"
      content="Yadav Shree Book Store, online book store, buy books online, books online India, best books, affordable books, novels, educational books"
    />

    <meta name="author" content="Yadav Shree Book Store" />

    <!-- Search Engine -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://YOUR-DOMAIN.com/"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Yadav Shree Book Store | Buy Books Online"
    />
    <meta
      property="og:description"
      content="Discover and buy books online from Yadav Shree Book Store."
    />
    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />
    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/og-image.png"
    />
    <meta property="og:site_name" content="Yadav Shree Book Store" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Yadav Shree Book Store | Buy Books Online"
    />
    <meta
      name="twitter:description"
      content="Discover and buy books online from Yadav Shree Book Store."
    />
    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/og-image.png"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
